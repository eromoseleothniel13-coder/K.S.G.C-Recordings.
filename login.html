<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071b33">
    <title>K.S.G.C Recordings - Admin Login</title>
    <link rel="icon" type="image/png" href="/images/ksgc-images.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to content</a>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-inner">
            <a class="public-brand" href="/" aria-label="K.S.G.C Recordings home">
                <img src="/images/ksgc-images.png" alt="">
                <span>K.S.G.C Recordings</span>
            </a>

            <nav aria-label="Main navigation">
                <a href="/">Home</a>
            </nav>
        </div>
    </header>


    <!-- LOGIN SECTION -->
    <main class="login-page" id="mainContent" tabindex="-1">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p class="login-description">
                Sign in to manage K.S.G.C Recordings.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button id="loginButton" type="submit" class="login-button">
                    Login
                </button>

                <p id="message" class="login-message" role="status" aria-live="polite"></p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© 2026 K.S.G.C Recordings. All Rights Reserved.</p>
    </footer>


    <!-- LOGIN SCRIPT -->
    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");
        let isLockedOut = false;

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            if (isLockedOut || loginButton.disabled) {
                return;
            }

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Checking...";
            message.textContent = "Connecting to secure login...";
            message.className = "login-message";

            try {

                const response = await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });

                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error("The server returned a web page instead of login data. Restart the server and try again.");
                }
                const data = await response.json();

                if (response.ok) {

                    message.textContent = "Login successful. Opening admin portal...";

                    setTimeout(function() {
                        window.location.href = "/admin.html";
                    }, 500);

                } else {

                    message.textContent = data.message || "Login failed.";
                    message.className = "login-message error";

                    if (data.attemptsRemaining === 0 && data.lockedUntil) {
                        const unlockTime = new Date(data.lockedUntil).getTime();
                        const remainingTime = unlockTime - Date.now();

                        if (Number.isFinite(unlockTime) && remainingTime > 0) {
                            isLockedOut = true;
                            loginButton.textContent = "Locked until tomorrow";
                            window.setTimeout(function() {
                                isLockedOut = false;
                                loginButton.disabled = false;
                                loginButton.textContent = "Login";
                                message.textContent = "You can try to log in again.";
                                message.className = "login-message";
                            }, remainingTime);
                        }
                    }

                }

            } catch (error) {

                message.textContent = error.message ||
                    "Unable to connect to the server. Make sure the server is running.";

                message.className = "login-message error";

            } finally {

                if (!isLockedOut) {
                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                }

            }

        });

    </script>

    <script src="script.js"></script>

</body>
</html>
